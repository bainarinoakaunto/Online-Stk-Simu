<script>
(() => {
  "use strict";

  // 稼働状況API
  const STATUS_API_URL =
    "https://script.google.com/macros/s/AKfycbwOJATEtUjlnDH0ufn1ypC4NJwjCtcmFlDanMp5Qwgg2Cc4aY9g8n3Si_oLkUVErP5QaA/exec";

  // 対象サービス
  const TARGET_KEY = "kabuonrain";

  // 更新間隔：60秒
  const CHECK_INTERVAL = 60 * 1000;

  let maintenanceMode = false;
  let checking = false;
  let originalTitle = document.title;

  // メンテナンス画面
  const MAINTENANCE_HTML = `
    <!DOCTYPE html>
    <html lang="ja">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>メンテナンス中</title>
    </head>
    <body bgcolor="#f8f8f8" text="#333333">
      <center>
        <br><br><br><br>
        <h2>ただいまメンテナンス中です</h2>
        <p>
          現在、システムメンテナンスを実施しております。<br>
          ご不便をおかけいたしますが、<br>
          しばらく経ってから再度アクセスしてください。
        </p>
      </center>
    </body>
    </html>
  `;

  // メンテナンス画面へ切り替え
  function showMaintenance() {
    if (maintenanceMode) return;

    maintenanceMode = true;

    document.open();
    document.write(MAINTENANCE_HTML);
    document.close();
  }

  // 通常画面へ復帰
  function hideMaintenance() {
    if (!maintenanceMode) return;

    maintenanceMode = false;

    location.reload();
  }

  // ステータス確認
  async function checkStatus() {

    if (checking || maintenanceMode) return;

    checking = true;

    try {
      const url = new URL(STATUS_API_URL);

      // キャッシュ回避
      url.searchParams.set("_", Date.now());

      const response = await fetch(url.toString(), {
        method: "GET",
        cache: "no-store",
        redirect: "follow"
      });

      if (!response.ok) {
        throw new Error("API HTTP Error: " + response.status);
      }

      const data = await response.json();

      // services配列から対象サービスを検索
      if (!data || !Array.isArray(data.services)) {
        throw new Error("JSON形式が正しくありません");
      }

      const service = data.services.find(
        item => item && item.key === TARGET_KEY
      );

      if (!service) {
        console.warn("対象サービスが見つかりません");
        return;
      }

      console.log(
        "[STATUS]",
        service.key,
        service.status
      );

      // メンテナンス判定
      if (service.status === "メンテナンス中") {
        showMaintenance();
      }

    } catch (error) {
      console.error(
        "[STATUS CHECK ERROR]",
        error
      );

      // 通信エラーの場合は現在の画面を維持
    } finally {
      checking = false;
    }
  }

  // ページ表示直後に確認
  checkStatus();

  // 60秒ごとに確認
  setInterval(checkStatus, CHECK_INTERVAL);

})();
</script>
